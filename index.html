<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>glitch · bensn.me</title>
<meta name="description" content="Bilder mit Pixelsorting, Dithering und Glitch-Effekten bearbeiten.">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://bensn.me/shared/bensn.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="grid-bg"></div>

<div class="wrap">

  <nav class="app-nav">
    <a href="https://bensn.me" class="nav-crumb"><span>bensn</span>.me</a>
    <span class="nav-sep">/</span>
    <span class="nav-current">glitch</span>
    <div class="nav-right">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">bereit</span>
    </div>
  </nav>

  <div class="eyebrow-row">
    <div class="glitch-mark" data-text="GLITCH">GLITCH</div>
    <div class="eyebrow-sub">Pixelsort · Dithering · RGB-Shift · Datamosh-artige Effekte</div>
  </div>

  <div class="editor">
    <div class="editor-main" id="editorArea">
      <div class="toolbar">
        <button class="btn" id="newImageBtn">Neues Bild</button>
        <button class="btn" id="randomBtn">🎲 Zufalls-Glitch</button>
        <button class="btn btn-ghost" id="resetBtn">Zurücksetzen</button>
        <div class="toolbar-spacer"></div>
        <span class="dim-text" id="dimText"></span>
        <button class="btn btn-primary" id="downloadBtn">Download</button>
      </div>

      <div class="upload-zone" id="uploadZone">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.5" style="margin:0 auto;">
          <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="upload-title">Bild hierher ziehen oder klicken</div>
        <div class="upload-sub">JPG, PNG, WebP — oder einfach einfügen (⌘V)</div>
      </div>

      <div class="canvas-stage" id="canvasStage">
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">Effekt-Stack</div>
      <select id="addEffectSelect"></select>
      <div class="effect-stack" id="effectStack"></div>
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="js/effects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
